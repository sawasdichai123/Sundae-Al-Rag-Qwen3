# ═══════════════════════════════════════════════════════════════════
# SUNDAE — Docker Compose
#
# ── Local development (no GPU required) ──────────────────────────
#   docker compose up -d                    # frontend + backend only
#   → Frontend: http://localhost:5173
#   → Backend:  http://localhost:8001
#   (Ollama must run on host: ollama serve)
#
# ── Production (with Caddy + Ollama) ─────────────────────────────
#   export SITE_DOMAIN=sundae.example.com
#   docker compose --profile production up -d
#   → auto HTTPS via Let's Encrypt
#
# NOTE: Supabase is NOT included — connect externally via .env
# ═══════════════════════════════════════════════════════════════════

services:
  # ── React Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: sundae-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sundae-network

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sundae-backend
    ports:
      - "8001:8000"
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - sundae-network

  # ── ngrok Tunnel (dev LINE webhook) ─────────────────────────────
  # Requires NGROK_AUTHTOKEN in .env
  # After start: docker logs sundae-ngrok → copy the Forwarding URL
  ngrok:
    image: ngrok/ngrok:latest
    container_name: sundae-ngrok
    command: http host.docker.internal:8001 --log stdout
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sundae-network

  # ── Caddy Reverse Proxy (production only) ──────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: sundae-caddy
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - sundae-network

  # ── Ollama AI Engine (production only — GPU required) ───────────
  ollama:
    image: ollama/ollama:latest
    container_name: sundae-ollama
    profiles: ["production"]
    expose:
      - "11434"
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped
    networks:
      - sundae-network

networks:
  sundae-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
