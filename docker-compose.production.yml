# ═══════════════════════════════════════════════════════════════════
# SUNDAE — Docker Compose (Production)
#
# Usage:
#   1. Copy .env.production.example → .env.production and fill values
#   2. docker compose -f docker-compose.production.yml up -d --build
#   3. First-time LLM model pull:
#      docker compose -f docker-compose.production.yml exec ollama ollama pull qwen3:14b
#
# NOTE: Supabase is external (cloud) — not included here
# NOTE: SSL/TLS is handled by reverse proxy (Nginx/Caddy) on the host
# ═══════════════════════════════════════════════════════════════════

services:

  # ── Nginx Reverse Proxy (SSL termination + routing) ──────────────
  nginx:
    image: nginx:alpine
    container_name: sundae-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # SSL certs (Let's Encrypt or manual)
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - sundae-network

  # ── Certbot (Let's Encrypt SSL — run once to issue cert) ─────────
  certbot:
    image: certbot/certbot:latest
    container_name: sundae-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Run manually: docker compose -f docker-compose.production.yml run --rm certbot certonly ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # ── React Frontend (Nginx static) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: sundae-frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - sundae-network

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sundae-backend
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - sundae-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Ollama AI Engine ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sundae-ollama
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - sundae-network

volumes:
  ollama-data:
    driver: local
  certbot-www:
    driver: local

networks:
  sundae-network:
    driver: bridge
